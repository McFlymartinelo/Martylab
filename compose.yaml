# Martylab production foundation (Debian).
#
# - Portal is the only host-published service (:3100 by default).
# - Backend and PostgreSQL stay on the internal Docker network.
# - Never run: docker compose down -v
# - Persistent DB volume: martylab_postgres_data

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-martylab}
      POSTGRES_USER: ${POSTGRES_USER:-martylab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - martylab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-martylab} -d ${POSTGRES_DB:-martylab}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - martylab

  backend:
    build:
      context: .
      dockerfile: docker/backend/Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      HOST: ${HOST:-0.0.0.0}
      PORT: ${PORT:-3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      CORS_ORIGIN: ${CORS_ORIGIN:?CORS_ORIGIN is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET is required}
      SESSION_COOKIE_NAME: ${SESSION_COOKIE_NAME:-martylab_session}
      SESSION_TTL_DAYS: ${SESSION_TTL_DAYS:-7}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      HOST_PROC_PREFIX: /host/proc
      HOST_SYS_PREFIX: /host/sys
      HOST_ROOT_PATH: /host/root
      DOCKER_SOCKET_PATH: /var/run/docker.sock
      ORION_URL: ${ORION_URL:-}
      ORION_PUBLIC_URL: ${ORION_PUBLIC_URL:-}
      ORION_API_KEY: ${ORION_API_KEY:-}
      ORION_TIMEOUT_MS: ${ORION_TIMEOUT_MS:-6000}
      PLUGINS_DIR: /app/plugins
      MATCHDAY_URL: ${MATCHDAY_URL:-}
      MATCHDAY_PUBLIC_URL: ${MATCHDAY_PUBLIC_URL:-}
      MATCHDAY_GROUP_ID: ${MATCHDAY_GROUP_ID:-}
      MATCHDAY_SERVICE_USERNAME: ${MATCHDAY_SERVICE_USERNAME:-}
      MATCHDAY_SERVICE_PASSWORD: ${MATCHDAY_SERVICE_PASSWORD:-}
      MATCHDAY_USER_PASSWORDS: ${MATCHDAY_USER_PASSWORDS:-}
      MATCHDAY_TIMEOUT_MS: ${MATCHDAY_TIMEOUT_MS:-6000}
      PORTAINER_URL: ${PORTAINER_URL:-}
      PORTAINER_API_TOKEN: ${PORTAINER_API_TOKEN:-}
      PORTAINER_ENDPOINT_ID: ${PORTAINER_ENDPOINT_ID:-}
      PORTAINER_TIMEOUT_MS: ${PORTAINER_TIMEOUT_MS:-6000}
      PORTAINER_INSECURE_TLS: ${PORTAINER_INSECURE_TLS:-false}
      CLOUDFLARE_API_TOKEN: ${CLOUDFLARE_API_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_TUNNEL_ID: ${CLOUDFLARE_TUNNEL_ID:-}
      CLOUDFLARE_CHECK_HOSTNAMES: ${CLOUDFLARE_CHECK_HOSTNAMES:-}
      CLOUDFLARE_TIMEOUT_MS: ${CLOUDFLARE_TIMEOUT_MS:-6000}
      NAS_URL: ${NAS_URL:-}
      NAS_API_TOKEN: ${NAS_API_TOKEN:-}
      NAS_TIMEOUT_MS: ${NAS_TIMEOUT_MS:-6000}
      NAS_INSECURE_TLS: ${NAS_INSECURE_TLS:-true}
    group_add:
      - "${DOCKER_GID:-999}"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:3000/api/health/live >/dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      start_period: 40s
      retries: 5
    networks:
      - martylab

  portal:
    build:
      context: .
      dockerfile: docker/portal/Dockerfile
    restart: unless-stopped
    ports:
      - "${PORTAL_HOST_PORT:-3100}:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 15s
      retries: 5
    networks:
      - martylab

volumes:
  martylab_postgres_data:
    name: martylab_postgres_data

networks:
  martylab:
    name: martylab
